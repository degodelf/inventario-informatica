name: Build e Release do .exe

# Dispara quando uma tag de versão é enviada (ex: v1.0.1)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # necessário para criar a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller sv-ttk

      - name: Gerar o ícone a partir da logo
        run: python png_para_ico.py logo_jq.png logo_jq.ico

      - name: Compilar o .exe
        shell: cmd
        run: python -m PyInstaller --onefile --windowed --icon logo_jq.ico --add-data "logo_jq.png;." --collect-all sv_ttk --name Inventario app.py

      - name: Criar a release e anexar o .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/Inventario.exe
          --title "Versao ${{ github.ref_name }}"
          --notes "Atualizacao gerada automaticamente pelo GitHub Actions (JQSolucoesTI)."
