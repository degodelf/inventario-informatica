name: Build e Release do .exe

# Dispara quando uma tag de versão é enviada (ex: v1.0.1)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # necessário para criar a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller sv-ttk pillow

      - name: Gerar o ícone (vários tamanhos) a partir da logo
        run: python -c "from PIL import Image; Image.open('logo_jq.png').save('logo_jq.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128)])"

      - name: Compilar o .exe
        shell: cmd
        run: python -m PyInstaller --onefile --windowed --icon logo_jq.ico --add-data "logo_jq.png;." --add-data "logo_jq.ico;." --add-data "adb;adb" --collect-all sv_ttk --name Inventario app.py

      - name: Criar a release e anexar o .exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/Inventario.exe
          --title "Versao ${{ github.ref_name }}"
          --notes "Atualizacao gerada automaticamente pelo GitHub Actions (JQSolucoesTI)."
